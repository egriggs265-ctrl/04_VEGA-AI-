# verify.yml — every push / PR runs the full vega self-test suite.
# Hermetic by design: no network, no pip installs, stdlib-only programs.
# Any non-zero exit fails the job.
name: verify

on:
  push:
  pull_request:

jobs:
  self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python self-tests
        run: |
          for p in vega-watchdog.py vega-health.py vega-inbox.py vega-rollup.py vega-sensor.py vega-ask.py vega-cron.py vega-status.py; do
            echo "== $p --self-test"
            python3 "$p" --self-test || exit 1
          done

      - name: Shell syntax + self-tests
        run: |
          bash -n bootstrap.sh
          bash -n vega-logrotate.sh
          bash -n vega-talk.sh
          bash -n vega-restore.sh
          echo "== vega-logrotate.sh --self-test"
          bash vega-logrotate.sh --self-test || exit 1
          echo "== vega-talk.sh --self-test"
          bash vega-talk.sh --self-test || exit 1
          echo "== vega-restore.sh --self-test"
          bash vega-restore.sh --self-test || exit 1

      - name: Bootstrap probe
        run: |
          bash bootstrap.sh --check || exit 1

      - name: Bootstrap self-test
        run: |
          bash bootstrap.sh --self-test || exit 1
